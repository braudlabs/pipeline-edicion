<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cutroom · Mapa de Birdieballs</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#101713;color:#edf1e8;font:15px/1.55 -apple-system,BlinkMacSystemFont,sans-serif}header{padding:20px 4vw;border-bottom:1px solid #354138;display:flex;gap:25px;align-items:center;flex-wrap:wrap}a{color:#d8ff78;text-underline-offset:4px}.brand{font-weight:750;font-size:21px;color:#edf1e8;text-decoration:none}main{max-width:1180px;margin:auto;padding:36px 24px 80px}.eyebrow{font-size:11px;letter-spacing:.1em;color:#d8ff78}h1{font-size:38px;line-height:1.12;letter-spacing:-1px;max-width:840px}h2{font-size:23px;margin:34px 0 14px}p{color:#c1cdc2}.lead{max-width:850px;font-size:18px}.pill{display:inline-block;font-size:11px;border:1px solid #546647;border-radius:20px;padding:5px 12px;color:#d8ff78}.columns{display:grid;grid-template-columns:1fr 1fr;gap:18px}.box{background:#19271e;border:1px solid #354138;border-radius:12px;padding:20px}.box h3{margin:0 0 10px}.box p,.box li{font-size:13px}.box ul{padding-left:18px;color:#c1cdc2}.box li{margin:8px 0}.timeline{display:flex;gap:8px;overflow:auto;margin:20px 0;padding-bottom:10px}.timeline a{min-width:120px;max-width:150px;border:1px solid #42523d;border-radius:8px;padding:10px;text-decoration:none;font-size:12px}.timeline small{display:block;color:#b3c4b4}.scene{display:grid;grid-template-columns:160px 1fr;gap:24px;border-top:1px solid #354138;padding:28px 0;scroll-margin-top:18px}.scene img{width:160px;height:284px;object-fit:contain;background:#07100a;border-radius:8px}.scene h3{font-size:24px;margin:4px 0 12px;letter-spacing:-.4px}.scene p{font-size:14px;margin:8px 0}.scene strong{color:#edf1e8}.scene small{font-size:11px;color:#aabeac;display:block}.scene a{font-size:12px}.scene details{margin-top:12px;font-size:12px;color:#b3c4b4}.scene .basis{margin-top:15px}.notice{padding:16px;border:1px solid #d8ff78;border-radius:9px;margin:20px 0}footer{border-top:1px solid #354138;margin-top:24px;padding-top:20px;font-size:12px;color:#b3c4b4}@media(max-width:650px){h1{font-size:30px}.columns{grid-template-columns:1fr}.scene{grid-template-columns:95px 1fr;gap:15px}.scene img{width:95px;height:169px}.scene h3{font-size:20px}main{padding:24px 16px}header{font-size:12px}}
</style></head><body><header><a class="brand" href="/">cutroom / dirección</a><a href="/quiz">Tus respuestas</a><a href="/">Versiones</a><a href="/study">Estudio</a></header><main id="content"><p>Cargando tus decisiones…</p></main><script type="module">
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
try{const [d,q]=await Promise.all(['/api/direction','/api/quiz'].map(async u=>{const r=await fetch(u);if(!r.ok)throw Error('No se pudo cargar el mapa');return r.json();}));const time=t=>t.toFixed(2).replace('.',',');const refs=ids=>ids.map(id=>esc(q.catalog.sources.find(s=>s.slug===id)?.title.replace('.mp4','')||id)).join(' · ');document.querySelector('#content').innerHTML=`<span class="eyebrow">BIRDIEBALLS · RESPUESTAS RECIBIDAS</span><h1>Humor, tipografía expresiva<br>y el producto en el plano real.</h1><p class="lead">Tus elecciones ya definen el lenguaje. Este mapa traduce esa dirección a cada frase de los primeros 19,6 segundos.</p><span class="pill">Mapa propuesto · aún no renderizado</span><p>Basado en tu revisión ${d.sourceQuiz.revision} · ${d.sourceQuiz.answered}/${d.sourceQuiz.total} preguntas con respuesta. Las indicaciones de desconocimiento siguen abiertas.</p>${q.state.revision!==d.sourceQuiz.revision?'<div class="notice">Has cambiado respuestas después de crear este mapa. Revisar esas diferencias antes de usarlo para editar.</div>':''}<div class="columns"><section class="box"><h3>Lo que has elegido</h3><ul>${d.confirmed.map(s=>'<li>'+esc(s)+'</li>').join('')}</ul></section><section class="box"><h3>Cómo lo voy a aplicar</h3><p>Concentrar el espectáculo en composiciones tipográficas distintas y en los gags reales. El bloque de producto mantiene el metraje visible; no repite el interludio de bolas flotantes.</p><p>Reservar una única oclusión protagonista para <strong>SOLUCIÓN</strong>. La condensada se propone para <strong>¡NO!</strong>. Ambas son decisiones de ejecución que deben comprobarse visualmente.</p><p>Donde has escrito «lo q quieras» decidiré con criterio. «No sé» e «idk» siguen siendo cuestiones abiertas.</p></section></div><h2>Referencias para esta pieza</h2><p>${refs(d.selectedReferences)}</p><details><summary>Referencias fuera de la dirección de este anuncio</summary><p>${refs(d.excludedAsDirection)}</p><p>Se conservan en el estudio. Tu selección se refiere a Birdieballs.</p></details><h2>Mapa de los 20 segundos</h2><p>${esc(d.intro)}</p><nav class="timeline" aria-label="Momentos del vídeo">${d.scenes.map(s=>`<a href="#${s.id}"><small>${time(s.start)}–${time(s.end)} s</small>${esc(s.title)}</a>`).join('')}</nav><p class="notice">Las imágenes siguientes son fotogramas del original. Describen dónde irá cada intervención; no son una V05 ni fotogramas de diseño aprobados.</p>${d.scenes.map(s=>`<article class="scene" id="${s.id}"><div><img loading="lazy" src="/api/quiz/source-frame/${s.frame}" alt="Fotograma original de ${esc(s.title)}"><small>Original · f${s.frame}</small></div><div><span class="eyebrow">${time(s.start)}–${time(s.end)} S</span><h3>${esc(s.title)}</h3><p>${esc(s.proposal)}</p><p><strong>Movimiento:</strong> ${esc(s.movement)}</p><details><summary>Qué debe superar la auto-prueba</summary><p>${esc(s.check)}</p></details><p class="basis"><a href="/study?rule=${s.reference.rule}&source=${s.reference.source}&frame=${s.reference.frame}" target="_blank" rel="noopener">Comparar con la referencia real ↗</a></p><small>Decisiones de origen: ${s.basis.map(id=>`<a href="/quiz?section=${q.catalog.questions.find(x=>x.id===id)?.section||'referencias'}#${id}">${esc(id)}</a>`).join(' · ')}</small></div></article>`).join('')}<h2>Antes de fijar la siguiente ejecución</h2><div class="columns"><section class="box"><h3>Comparaciones y recursos condicionados</h3><ul>${d.open.filter(x=>x.kind!=='unanswered').map(x=>'<li>'+esc(x.text)+'</li>').join('')}</ul></section><section class="box"><h3>Auto-pruebas previstas</h3><ul>${d.nextChecks.map(x=>'<li>'+esc(x)+'</li>').join('')}</ul><p>Las cinco preguntas vacías no rellenan parámetros por defecto. No necesitas completarlas para revisar este mapa.</p></section></div><footer>${d.notYetDone.map(esc).join(' · ')}<p>Montaje base: Remotion · motion graphics: Remotion · ${d.scope.frames} fotogramas originales, sin cortes ni cambios de velocidad añadidos.</p></footer>`;}catch(e){document.querySelector('#content').textContent=e.message;}
</script></body></html>
