<!doctype html><html lang="ca"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thinking · previsualització</title><link rel="stylesheet" href="/flow.css"><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f3f5f9;font-family:system-ui,sans-serif;--accent:#367dff;color:#27374a}main{width:min(480px,85vw)}h1{font-size:14px;font-weight:500;margin-bottom:32px;color:#677587}.agent-working{display:flex;align-items:center;gap:6px;font-size:14px;min-height:48px}p{font-size:12px;color:#788391;line-height:1.7;margin-top:32px}</style><main><h1>Previsualització del thinking</h1><div class="agent-working is-thinking"><span class="thinking-orb" aria-hidden="true"></span><span class="thinking-label">Pensando…</span></div><p>Animació i estil reals del xat.</p><button id="test-status" style="border:0;background:transparent;color:#536479;font:inherit;font-size:12px;padding:0;cursor:pointer">Provar canvi d’estat</button></main><script type="module">
import {changeThinkingText} from '/thinking-status.js';
const button=document.querySelector('#test-status'),label=document.querySelector('.thinking-label');
button.addEventListener('click',async()=>{button.disabled=true;for(const value of ['Trabajando…','Escribiendo la respuesta…','Pensando…']){await changeThinkingText(label,value,{reduced:matchMedia('(prefers-reduced-motion: reduce)').matches});await new Promise(r=>setTimeout(r,1200));}button.disabled=false;});
</script></html>
